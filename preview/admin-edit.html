<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑文章 — 拾光札记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=EB+Garamond:ital,wght@0,500;1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#F1ECE1; --paper-deep:#E7DFD0; --paper-alt:#FBF8F2;
    --ink:#2B2620; --ink-soft:#6B6252; --ink-faint:#9C927E;
    --accent:#5B4B8A; --accent-soft:#8477AC;
    --moss:#748052; --moss-soft:#9DA97A;
    --line:#CBBFA6; --shadow: 2px 3px 0 rgba(43,38,32,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif SC",serif;line-height:1.7;-webkit-font-smoothing:antialiased;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle at 20% 30%,rgba(43,38,32,0.025) 0,transparent 40%),radial-gradient(circle at 80% 70%,rgba(43,38,32,0.02) 0,transparent 45%);z-index:0;}
  .wrap{max-width:960px;margin:0 auto;padding:0 32px;position:relative;z-index:1;}
  a{color:inherit;text-decoration:none;}

  /* Header */
  .site-header{position:sticky;top:0;z-index:20;background:rgba(241,236,225,0.88);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
  .site-header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:18px;}
  .logo{font-size:22px;font-weight:700;letter-spacing:0.06em;display:flex;align-items:baseline;gap:8px;}
  .logo .dot{color:var(--accent);font-size:16px;}
  nav{display:flex;gap:32px;}
  nav a{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink-soft);position:relative;padding-bottom:3px;}
  nav a.active{color:var(--accent);}

  /* Admin form */
  .admin-page{padding:72px 0 96px;}
  .admin-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:48px;padding-bottom:28px;border-bottom:1px solid var(--line);}
  .admin-title-group{display:flex;flex-direction:column;gap:6px;}
  .admin-label{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:0.2em;color:var(--ink-faint);text-transform:uppercase;}
  .admin-header h1{font-size:36px;font-weight:900;margin:0;letter-spacing:0.02em;}
  .admin-back{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;transition:color 0.2s ease;}
  .admin-back:hover{color:var(--accent);}
  .post-form{max-width:760px;}
  .form-row{margin-bottom:28px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  .form-row label{display:block;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-faint);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.1em;}
  .form-row input,.form-row select,.form-row textarea{
    width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:3px;
    background:var(--paper-alt);font-family:"Noto Serif SC",serif;font-size:15px;color:var(--ink);
    transition:border-color 0.2s ease,box-shadow 0.2s ease;
  }
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,75,138,0.08);
  }
  .form-row textarea{resize:vertical;font-family:"JetBrains Mono",monospace;font-size:14px;line-height:1.7;}
  .form-hint{font-size:12px;color:var(--ink-faint);margin:8px 0 0;}
  .form-actions{display:flex;align-items:center;gap:24px;margin-top:40px;padding-top:32px;border-top:1px solid var(--line);}
  .admin-btn{
    font-family:"JetBrains Mono",monospace;font-size:13px;padding:12px 28px;
    background:var(--ink);color:var(--paper);border:none;border-radius:3px;
    cursor:pointer;transition:all 0.25s ease;box-shadow:var(--shadow);
  }
  .admin-btn:hover{background:var(--accent);transform:translateY(-1px);}
  .form-cancel{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink-soft);transition:color 0.2s ease;}
  .form-cancel:hover{color:var(--accent);}
  .form-msg{font-family:"JetBrains Mono",monospace;font-size:13px;margin-top:16px;min-height:18px;}

  /* Footer */
  footer{padding:36px 0;}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-faint);}

  @media(max-width:720px){.form-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="/" class="logo">拾光札记<span class="dot">·</span></a>
    <nav>
      <a href="/">首页</a>
      <a href="/posts">随笔</a>
      <a href="/about">关于</a>
      <a href="/#subscribe">订阅</a>
      <a href="/admin" class="active">管理</a>
      <a href="#" style="color:var(--ink-faint)">登出</a>
    </nav>
  </div>
</header>

<section class="admin-page">
  <div class="wrap">
    <div class="admin-header">
      <div class="admin-title-group">
        <span class="admin-label">EDIT POST</span>
        <h1>编辑文章</h1>
      </div>
      <a href="#" class="admin-back">← 返回列表</a>
    </div>

    <form class="post-form">
      <div class="form-row">
        <label for="title">标题</label>
        <input type="text" id="title" value="楼下的猫今天没有出现" required />
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label for="slug">URL 标识 (slug)</label>
          <input type="text" id="slug" value="lou-xia-de-mao" required />
        </div>
        <div class="form-row">
          <label for="date">日期</label>
          <input type="date" id="date" value="2026-07-09" required />
        </div>
        <div class="form-row">
          <label for="mood">心情/天气</label>
          <select id="mood" required>
            <option value="晴" selected>晴</option>
            <option value="多云">多云</option>
            <option value="雨">雨</option>
            <option value="夜">夜</option>
            <option value="风">风</option>
            <option value="雪">雪</option>
            <option value="雾">雾</option>
          </select>
        </div>
        <div class="form-row">
          <label for="tags">标签</label>
          <input type="text" id="tags" value="日常, 动物" />
          <p class="form-hint">多个标签用英文逗号隔开</p>
        </div>
      </div>

      <div class="form-row">
        <label for="excerpt">摘要</label>
        <textarea id="excerpt" rows="2" required>连续三年，它都会在早上七点半准时坐在自行车棚旁边晒太阳。今天没有。我在原地站了两分钟，突然意识到自己对一只猫的牵挂，比想象中要重。</textarea>
      </div>

      <div class="form-row">
        <label for="content">正文 (Markdown)</label>
        <textarea id="content" rows="20" required>连续三年，它都会在早上七点半准时坐在自行车棚旁边晒太阳。

今天没有。

我在原地站了两分钟，突然意识到自己对一只猫的牵挂，比想象中要重。

## 习惯的重量

人总是这样，对一些习以为常的东西浑然不觉，直到它们突然消失。那只猫从来没有主动亲近过我，甚至偶尔会在我走近时跳上墙头，用一种"你谁啊"的眼神看我。但它每天在那里，这件事本身，已经成了我生活的一部分。

就像楼下早餐店的豆浆味，就像七点四十准时经过的垃圾车，就像八点钟阳光照到对面楼顶的那一刻。

## 消失的瞬间

今天早上经过车棚，那个位置空空的。不是"猫还没来"的那种空，是"它可能不会来了"的那种空。

我站了一会儿，想了想可能的原因：

- 它可能找到了更好的晒太阳的地方
- 它可能去了别人家
- 它可能……

我不愿意往下想。

## 关于牵挂

我们总以为牵挂是双向的，其实不是。牵挂很多时候是单向的，甚至对方根本不知道你在牵挂它。那只猫不知道有个每天路过的人会留意它在不在，不知道有人会因为它的缺席而停下脚步。

但这不影响牵挂本身的重量。

也许这就是生活里那些"不重要的小事"的意义——它们不重要，但它们真实。真实到一旦消失，你会突然觉得这一天少了点什么。

希望它明天会在。</textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="admin-btn">保存修改</button>
        <a href="#" class="form-cancel">取消</a>
      </div>
      <p class="form-msg"></p>
    </form>
  </div>
</section>

<footer>
  <div class="wrap">
    <span>© 2026 拾光札记</span>
    <span>用文字，留住会被忘记的瞬间</span>
  </div>
</footer>

</body>
</html>
